---
# Flux Kustomization for the Tailscale operator (edatw-lab).
# Bridges in-cluster pods to tailnet hosts (egress). Consumed by the OpenClaw
# agent to reach the Ollama server on the tailnet (the egress Service lives in
# the ArgoCD-managed edatw-openclaw overlay). Uses the edatw-lab overlay for the
# cluster's SOPS-encrypted OAuth client credentials (operator-oauth).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-operator
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  prune: true
  wait: true

  decryption:
    provider: sops
    secretRef:
      name: sops-age

  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  path: ./flux/overlays/tailscale-operator/edatw-lab

  # Only needs pod networking; no webhook/cert-manager dependency.
  dependsOn:
    - name: cilium

  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: operator
      namespace: tailscale
