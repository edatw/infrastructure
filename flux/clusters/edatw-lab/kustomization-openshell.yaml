---
# Flux Kustomization for OpenShell (edatw-lab)
# The agent tool-execution sandbox runtime/gateway. OpenClaw connects to it over
# mTLS (see argocd/edatw-openclaw). Uses the edatw-lab overlay for the cluster's
# SOPS-encrypted sandbox-JWT signing key.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openshell
  namespace: flux-system
spec:
  interval: 30m
  timeout: 15m
  prune: true
  wait: true

  decryption:
    provider: sops
    secretRef:
      name: sops-age

  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  path: ./flux/overlays/openshell/edatw-lab

  # Dependencies: cert-manager issues the in-cluster PKI (shared CA ClusterIssuer);
  # agent-sandbox provides the Sandbox CRD the compute driver uses; openebs
  # provides the default StorageClass for the gateway's 1Gi PVC.
  dependsOn:
    - name: cilium
    - name: cert-manager
    - name: agent-sandbox
    - name: openebs

  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: openshell
      namespace: openshell
