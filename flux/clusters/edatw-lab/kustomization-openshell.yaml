---
# Flux Kustomization for OpenShell (edatw-lab)
# The AgentHarness sandbox runtime/gateway. Installed before kagent so the
# controller's OPENSHELL_GATEWAY_URL target exists when harnesses are created.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openshell
  namespace: flux-system
spec:
  interval: 30m
  timeout: 15m
  prune: true
  wait: true

  # SOPS-encrypted SSH handshake secret lives in the edatw-lab overlay.
  decryption:
    provider: sops
    secretRef:
      name: sops-age

  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  # edatw-lab overlay: wraps ./flux/base/openshell + the SOPS handshake secret.
  path: ./flux/overlays/openshell/edatw-lab

  # cert-manager issues the in-cluster TLS server cert + CA.
  dependsOn:
    - name: cilium
    - name: cert-manager

  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: openshell
      namespace: openshell
