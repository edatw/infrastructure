---
# Flux Kustomization for OpenShell (edatw-lab)
# The AgentHarness sandbox runtime/gateway. Installed before kagent so the
# controller's OPENSHELL_GATEWAY_URL target exists when harnesses are created.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openshell
  namespace: flux-system
spec:
  interval: 30m
  timeout: 15m
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  path: ./flux/base/openshell

  # Dependencies: agent-sandbox provides the Sandbox CRD the compute driver uses;
  # openebs provides the default StorageClass for the gateway's 1Gi PVC. PKI is
  # self-contained (chart generate-certs hook), so no cert-manager dependency.
  dependsOn:
    - name: cilium
    - name: agent-sandbox
    - name: openebs

  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: openshell
      namespace: openshell
