---
# Shared base manifests reused from shangkuei/infrastructure (public repo).
# The cluster-agnostic app bases (cilium, cert-manager, openebs, csi-driver-smb,
# snapshot-controller, flux-operator, gateway-api) are NOT vendored into this
# repo -- the app Kustomizations source them from here and apply edatw-lab
# deltas via spec.patches.
#
# Tracks the upstream main branch (no tags exist upstream). This cluster follows
# upstream changes automatically on each reconcile -- to freeze it against an
# upstream change, add a `commit:` pin under ref alongside the branch.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: shangkuei-infrastructure
  namespace: flux-system
spec:
  interval: 1h
  timeout: 60s
  url: https://github.com/shangkuei/infrastructure.git
  ref:
    branch: main
