---
# Flux Kustomization for Flux Instance
# Deploys core Flux CD components (source, kustomize, helm, notification controllers)
# Managed by Flux Operator via FluxInstance CRD
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-instance
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  prune: true
  wait: true

  decryption:
    provider: sops
    secretRef:
      name: sops-age

  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  path: ./flux/overlays/flux-instance/edatw-lab

  # edatw-lab delta: pin the Flux distribution to an exact version, overriding
  # the floating "2.x" range in the base FluxInstance. Bumped to latest stable
  # by `just bump-flux`. Keep in sync with the Terraform gitops-edatw-lab
  # flux_version (it bootstraps the same FluxInstance).
  patches:
    - target:
        kind: FluxInstance
        name: flux
      patch: |-
        - op: replace
          path: /spec/distribution/version
          value: "v2.8.8"

  # Dependencies: flux-operator must be ready (provides FluxInstance CRD)
  dependsOn:
    - name: flux-operator

  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: source-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: kustomize-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: helm-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: notification-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: source-watcher
      namespace: flux-system
