---
# Flux Kustomization for cert-manager
# Automated certificate management with Gateway API support
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: shangkuei-infrastructure
    namespace: flux-system

  path: ./kubernetes/base/cert-manager

  # edatw-lab delta: pin the cert-manager chart version, overriding the version
  # carried by the remote base's HelmRelease. Bumped to latest stable by
  # `just bump-cert-manager`.
  patches:
    - target:
        kind: HelmRelease
        name: cert-manager
      patch: |-
        - op: replace
          path: /spec/chart/spec/version
          value: "v1.20.2"

  # Dependencies: Gateway API CRDs must be available for HTTP01/TLS challenges
  # Requires standard CRDs (experimental TLSRoute not needed by cert-manager)
  dependsOn:
    - name: gateway-api-standard

  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager-webhook
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager-cainjector
      namespace: cert-manager
