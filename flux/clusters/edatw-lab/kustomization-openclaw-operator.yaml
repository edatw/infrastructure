---
# Flux Kustomization for the OpenClaw operator (edatw-lab)
# Installs the controller-manager + CRDs (OpenClawInstance, OpenClawSelfConfig,
# OpenClawClusterDefaults). The agent itself (an OpenClawInstance) is delivered
# via ArgoCD into the edatw-openclaw namespace; this only provides the operator
# that reconciles it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openclaw-operator
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  path: ./flux/base/openclaw-operator

  # No webhook (no cert-manager) and CRDs ship with the chart, so the only
  # dependency is the CNI for pod networking.
  dependsOn:
    - name: cilium

  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: openclaw-operator
      namespace: openclaw-system
