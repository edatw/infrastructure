---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cluster: edatw-lab
# Organization: Application-based resource management
# Note: flux-system is managed by flux-operator (Helm-based)

# Dependency order:
# 1. gateway-api: CRDs (no dependencies)
# 2. cilium: CNI (depends on gateway-api, implements Gateway API)
# 3. cert-manager: Certificates (depends on gateway-api for HTTP01/TLS challenges)
# 4. openebs: Storage provisioner (depends on cilium for pod networking)
# 5. snapshot-controller: Volume snapshot controller (depends on cilium)
# 6. flux-operator: Foundation (depends on cilium, installed via Helm)
# 7. flux-instance: Core Flux components (depends on flux-operator)
# 8. argocd: GitOps CD install (depends on cilium)
# 9. argocd-projects: AppProjects/Applications (depends on argocd)

resources:
  # Namespace configuration (kube-system with pod security labels for CSI)
  - namespace-kube-system.yaml

  # Remote source: shared bases reused from shangkuei/infrastructure (pinned).
  - gitrepository-shangkuei.yaml

  # Gateway API source (GitRepository + ArtifactGenerator) from the remote base.
  - kustomization-gateway-api-source.yaml

  # Gateway API CRDs (standard + experimental)
  - kustomization-gateway-api-standard.yaml
  - kustomization-gateway-api-experimental.yaml

  # The app-level Kustomizations below are committed incrementally as the
  # cluster is deployed. Uncomment each once its manifests land in the repo.

  # CNI and certificate management (depend on Gateway API)
  - kustomization-cilium.yaml
  - kustomization-cert-manager.yaml

  # Storage provisioners (depend on CNI)
  - kustomization-openebs.yaml
  - kustomization-csi-driver-smb.yaml
  - kustomization-snapshot-controller.yaml

  # Infrastructure applications (Flux Kustomization CRs)
  # Flux foundation (installed via Helm)
  - kustomization-flux-operator.yaml
  - kustomization-flux-instance.yaml

  # GitOps applications (installed via Helm)
  # argocd = install (flux/overlays/argocd/edatw-lab);
  # argocd-projects = AppProjects/Applications (depends on argocd).
  - kustomization-argocd.yaml
  - kustomization-argocd-projects.yaml

  # Tailscale operator: tailnet (and later Funnel) exposure (depends on cilium).
  # config = namespace + OAuth secret (flux/overlays/tailscale-operator/edatw-lab);
  # operator = HelmRelease + ProxyClass from the shangkuei base (depends on config).
  # Uncomment after creating the OAuth client and running `just secret-oauth`
  # (then uncomment the secret in that overlay's kustomization.yaml).
  # - kustomization-tailscale-operator-config.yaml
  # - kustomization-tailscale-operator.yaml

  # Agent Sandbox (kubernetes-sigs/agent-sandbox): controller + Sandbox CRD.
  # Prerequisite for OpenShell's Kubernetes compute driver (install before openshell).
  - kustomization-agent-sandbox.yaml

  # OpenShell: AgentHarness sandbox runtime/gateway (depends on cilium +
  # cert-manager + agent-sandbox + openebs). Install before kagent — the
  # controller points at its gRPC gateway. Official chart
  # (nvidia/openshell/helm-chart 0.0.42), in-cluster TLS via a shared
  # cert-manager CA (so kagent can trust it cross-namespace); gateway auth
  # disabled, access via NetworkPolicy. See flux/base/openshell.
  - kustomization-openshell.yaml

  # OpenClaw operator: reconciles OpenClawInstance/OpenClawSelfConfig/
  # OpenClawClusterDefaults CRDs (openclaw.rocks/v1alpha1). Controller + CRDs
  # only (flux/base/openclaw-operator, chart paperclipinc/openclaw-operator);
  # the agent itself is an OpenClawInstance delivered via ArgoCD into the
  # edatw-openclaw namespace. Depends on cilium (no webhook -> no cert-manager).
  - kustomization-openclaw-operator.yaml

  # kagent: Kubernetes-native AI agent platform (depends on cilium + openebs +
  # openshell). crds = CRDs + namespace + OCI HelmRepository (flux/base/kagent-crds);
  # kagent = controller/UI + bundled persistent PostgreSQL (depends on crds).
  # Default model provider is Ollama (keyless); ensure Ollama is reachable at the
  # configured config.host (flux/base/kagent) before agents can run.
  #
  # PARKED: kagent is being replaced by the openclaw-operator + OpenShell stack.
  # The wiring (kustomization-kagent{,-crds}.yaml), bases (flux/base/kagent{,-crds})
  # and overlay (flux/overlays/kagent) are kept for reference; uncomment to restore.
  # - kustomization-kagent-crds.yaml
  # - kustomization-kagent.yaml
