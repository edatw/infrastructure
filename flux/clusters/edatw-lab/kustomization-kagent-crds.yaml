---
# Flux Kustomization for the kagent CRDs (edatw-lab)
# Installs the kagent namespace, OCI HelmRepository, and the kagent-crds chart
# ahead of the controller (the kagent Kustomization depends on this one).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kagent-crds
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  path: ./flux/base/kagent-crds

  dependsOn:
    - name: cilium

  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kagent-crds
      namespace: kagent
