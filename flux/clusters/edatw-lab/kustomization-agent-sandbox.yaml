---
# Flux Kustomization for Agent Sandbox (edatw-lab)
# Installs the kubernetes-sigs/agent-sandbox controller + the
# `sandboxes.agents.x-k8s.io` CRD (vendored pinned manifest, v0.4.6).
# Prerequisite for OpenShell's Kubernetes compute driver — install before openshell.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-sandbox
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  path: ./flux/base/agent-sandbox

  # CNI must be up before the controller pod schedules.
  dependsOn:
    - name: cilium

  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: agent-sandbox-controller
      namespace: agent-sandbox-system
