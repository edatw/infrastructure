---
# Flux Kustomization for Cilium CNI
# Critical infrastructure - must be first for cluster networking
# Gateway API support is optional and enabled when CRDs are available
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: shangkuei-infrastructure
    namespace: flux-system

  path: ./kubernetes/base/cilium

  # edatw-lab deltas to the shared base (applied at the Flux layer):
  #  - MTU 1230 for VXLAN tunnel over Tailscale (transport 1280 - 50B encap).
  #    Without it cross-node TLS/bulk traffic is dropped on tailscale0.
  #  - pin the chart to the version used by talos-cluster-edatw-lab.
  #  - disable ServiceMonitors: the Prometheus Operator CRDs
  #    (monitoring.coreos.com/v1) are not installed on edatw-lab, so the chart's
  #    validate.yaml hard-fails the upgrade. Re-enable once a monitoring stack
  #    with the ServiceMonitor CRD lands.
  patches:
    - target:
        kind: HelmRelease
        name: cilium
      patch: |-
        - op: add
          path: /spec/values/MTU
          value: 1230
        - op: replace
          path: /spec/chart/spec/version
          value: "1.19.5"
        - op: replace
          path: /spec/values/prometheus/serviceMonitor/enabled
          value: false
        - op: replace
          path: /spec/values/operator/prometheus/serviceMonitor/enabled
          value: false
        - op: replace
          path: /spec/values/hubble/metrics/serviceMonitor/enabled
          value: false

  # Dependencies: Gateway API CRDs required for Gateway API implementation
  # Requires both standard and experimental CRDs (TLSRoute)
  dependsOn:
    - name: gateway-api-standard
    - name: gateway-api-experimental

  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: cilium
      namespace: kube-system
    - apiVersion: apps/v1
      kind: Deployment
      name: cilium-operator
      namespace: kube-system
