---
# OpenClaw operator (controller-manager). Reconciles OpenClawInstance,
# OpenClawSelfConfig and OpenClawClusterDefaults (openclaw.rocks/v1alpha1).
# The actual agent (an OpenClawInstance in the edatw-openclaw namespace) is
# delivered separately via ArgoCD; this release installs only the operator + CRDs.
#
# Chart pinned to 0.36.5 (operator image tracks the chart appVersion).
#
# SCOPE: watchNamespaces is left empty -> the operator watches OpenClawInstance
# resources cluster-wide (and the chart renders cluster-scoped RBAC). This avoids
# coupling the operator's install ordering to the ArgoCD-created edatw-openclaw
# namespace. Restrict via values.watchNamespaces for least privilege if desired.
#
# CRDs: installed and kept by the chart (crds.install / crds.keep both true).
# WEBHOOK: disabled by default, so no cert-manager dependency.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openclaw-operator
  namespace: openclaw-system
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: openclaw-operator
      version: "0.36.5"
      sourceRef:
        kind: HelmRepository
        name: openclaw-operator
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    crds:
      install: true
      keep: true
    # Webhook off -> no cert-manager needed.
    webhook:
      enabled: false
    # Prometheus Operator not installed; keep the ServiceMonitor off.
    metrics:
      serviceMonitor:
        enabled: false
