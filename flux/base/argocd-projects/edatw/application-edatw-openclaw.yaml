---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edatw-openclaw
  namespace: argocd
  labels:
    app.kubernetes.io/name: edatw-openclaw
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: gateway
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: edatw

  source:
    repoURL: https://github.com/edatw/infrastructure.git
    targetRevision: HEAD
    # Path should be overridden in overlay with cluster-specific path
    path: argocd/edatw-openclaw/base

  destination:
    server: https://kubernetes.default.svc
    namespace: edatw-openclaw

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    # The Tailscale operator rewrites the ollama egress Service's externalName
    # from the manifest's `placeholder` to the in-cluster proxy DNS name. Ignore
    # it so ArgoCD (selfHeal) doesn't fight the operator and flap the egress.
    - group: ""
      kind: Service
      name: ollama
      namespace: edatw-openclaw
      jsonPointers:
        - /spec/externalName
