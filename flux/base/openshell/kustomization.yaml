---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace-openshell.yaml
  # In-cluster PKI (cert-manager): self-signed root -> CA -> gateway server cert.
  - clusterissuer-selfsigned.yaml
  - certificate-ca.yaml
  - clusterissuer-ca.yaml
  - certificate-server.yaml
  - helmrepository-openshell.yaml
  - helmrelease-openshell.yaml

labels:
  - pairs:
      app.kubernetes.io/name: openshell
      app.kubernetes.io/managed-by: flux
