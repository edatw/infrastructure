---
# OpenShell in-cluster CA. Stored in the cert-manager namespace so the
# openshell-ca ClusterIssuer (cluster resource namespace) can sign from it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openshell-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: openshell-ca
  secretName: openshell-ca
  duration: 87600h # 10y
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: openshell-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
