---
# OpenShell client-CA bundle (in-cluster TLS).
# The openshell chart (v0.1.0) always mounts server.tls.clientCaSecretName at
# /etc/openshell-tls/client-ca/ca.crt, even with disableGatewayAuth=true, so the
# secret must exist or the pod is stuck mounting it (ContainerCreating).
#
# We issue a throwaway leaf from the openshell-ca ClusterIssuer purely so
# cert-manager writes the issuing CA into the secret's ca.crt key — that ca.crt
# (CN=openshell-ca) is the client-CA bundle the gateway verifies clients against.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openshell-server-client-ca
  namespace: openshell
spec:
  secretName: openshell-server-client-ca
  commonName: openshell-client-ca
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: openshell-ca
    kind: ClusterIssuer
    group: cert-manager.io
