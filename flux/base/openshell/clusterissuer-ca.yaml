---
# OpenShell in-cluster CA issuer. Signs the gateway server + client certs
# (openshell ns) and the kagent-side CA bundle (kagent ns). Reads the CA keypair
# from the openshell-ca secret in the cluster resource namespace (cert-manager).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openshell-ca
spec:
  ca:
    secretName: openshell-ca
