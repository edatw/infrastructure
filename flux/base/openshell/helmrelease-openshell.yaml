---
# OpenShell gateway (agent tool-execution sandbox runtime).
# Official NVIDIA chart `helm-chart`, pinned to the latest stable 0.0.71 (chart,
# gateway image and supervisor image are released as a matched set via appVersion).
# OpenClaw reaches this over mTLS at
# openshell.openshell.svc.cluster.local:8080 (see argocd/edatw-openclaw).
#
# COMPUTE DRIVER: Kubernetes. Provisions sandbox pods via the Agent Sandbox CRD
# (sandboxes.agents.x-k8s.io) — requires the agent-sandbox controller installed
# first (flux/base/agent-sandbox; this Kustomization dependsOn it).
#
# PKI: provided by cert-manager (see the Certificate/ClusterIssuer manifests in
# this base), NOT the chart's own modes (pkiInitJob + certManager both disabled).
# We need a shared CA ClusterIssuer so OpenClaw (a different namespace) can chain
# to it to verify the gateway; the chart's PKI keeps its CA inside this namespace.
# The server TLS secret's ca.crt doubles as the client-CA bundle (clientCaSecretName).
#
# AUTH MODEL (in-cluster mTLS):
#  - TLS ENABLED (cert-manager server cert; the gateway binds 0.0.0.0).
#  - mTLS ALWAYS required in chart 0.0.71 — the server terminates mTLS and rejects
#    clients without a cert chaining to the openshell-ca (tls.clientCaSecretName).
#    OpenClaw uses a cert-manager client cert from that CA (argocd/edatw-openclaw).
#    auth.allowUnauthenticatedUsers is false so there is no local-dev bypass.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openshell
  namespace: openshell
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: helm-chart
      version: "0.0.71"
      sourceRef:
        kind: HelmRepository
        name: openshell
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    service:
      type: ClusterIP
    server:
      sandboxNamespace: openshell
      # In-cluster TLS on. As of chart 0.0.71 the gateway ALWAYS terminates mTLS
      # and requires a client cert (the old `disableGatewayAuth` flag is gone);
      # mTLS stays enabled simply by keeping tls.clientCaSecretName set. OpenClaw
      # connects with a cert-manager client cert chaining to the openshell-ca
      # (see argocd/edatw-openclaw).
      disableTls: false
      # OIDC user auth is intentionally skipped, so trust any mTLS-authenticated
      # caller as a local-dev principal. Access control rests on client mTLS (a
      # cert from openshell-ca) + the NetworkPolicy (OpenClaw ns only). Without
      # this, sandbox ops fail with "missing authorization header".
      auth:
        allowUnauthenticatedUsers: true
      tls:
        # cert-manager-issued secrets (this base). The server cert's ca.crt is
        # reused for the client-CA mount, so no separate client-CA secret.
        certSecretName: openshell-server-tls
        clientCaSecretName: openshell-server-tls
        clientTlsSecretName: openshell-client-tls
      # Sandbox-JWT signing key (chart 0.0.71+). The chart's certgen hook is
      # disabled (pkiInitJob + certManager false, to keep our hand-rolled CA), so
      # this Secret is hand-provisioned via the edatw-lab overlay (SOPS).
      sandboxJwt:
        signingSecretName: openshell-sandbox-jwt
    # PKI is provided by cert-manager, not the chart's own modes.
    pkiInitJob:
      enabled: false
    certManager:
      enabled: false
