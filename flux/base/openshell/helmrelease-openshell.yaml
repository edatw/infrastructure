---
# OpenShell gateway (kagent AgentHarness runtime: openshell).
# Official NVIDIA chart `helm-chart`, pinned to the latest stable 0.0.42 (chart,
# gateway image and supervisor image are released as a matched set via appVersion).
# The kagent controller reaches this over TLS gRPC at
# openshell.openshell.svc.cluster.local:8080 (see flux/base/kagent).
#
# COMPUTE DRIVER: Kubernetes. Provisions sandbox pods via the Agent Sandbox CRD
# (sandboxes.agents.x-k8s.io) — requires the agent-sandbox controller installed
# first (flux/base/agent-sandbox; this Kustomization dependsOn it).
#
# PKI: provided by cert-manager (see the Certificate/ClusterIssuer manifests in
# this base), NOT the chart's own modes (pkiInitJob + certManager both disabled).
# We need a shared CA ClusterIssuer so kagent (a different namespace) can chain to
# it to verify the gateway; the chart's PKI keeps its CA inside this namespace.
# The server TLS secret's ca.crt doubles as the client-CA bundle (clientCaSecretName).
#
# AUTH MODEL (in-cluster TLS only):
#  - TLS ENABLED (cert-manager server cert; the gateway binds 0.0.0.0).
#  - Gateway auth DISABLED (disableGatewayAuth) — no mTLS client cert required;
#    the link is encrypted and access control rests on the NetworkPolicy.
#    Flip to false (+ provision a client cert for kagent) to enforce mTLS.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openshell
  namespace: openshell
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: helm-chart
      version: "0.0.42"
      sourceRef:
        kind: HelmRepository
        name: openshell
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    service:
      type: ClusterIP
    server:
      sandboxNamespace: openshell
      # In-cluster TLS on; gateway auth off (no client cert) — access via NetworkPolicy.
      disableTls: false
      disableGatewayAuth: true
      tls:
        # cert-manager-issued secrets (this base). The server cert's ca.crt is
        # reused for the client-CA mount, so no separate client-CA secret.
        certSecretName: openshell-server-tls
        clientCaSecretName: openshell-server-tls
        clientTlsSecretName: openshell-client-tls
    # PKI is provided by cert-manager, not the chart's own modes.
    pkiInitJob:
      enabled: false
    certManager:
      enabled: false
