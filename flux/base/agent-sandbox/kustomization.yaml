---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Agent Sandbox (kubernetes-sigs/agent-sandbox) — controller + the
# `sandboxes.agents.x-k8s.io` CRD. Hard prerequisite for OpenShell's Kubernetes
# compute driver, which provisions sandbox pods via this CRD.
#
# manifest.yaml is vendored verbatim from the upstream pinned release:
#   https://github.com/kubernetes-sigs/agent-sandbox/releases/download/v0.4.6/manifest.yaml
# Re-vendor on upgrade (do not hand-edit): bump the version, re-download, replace.
resources:
  - manifest.yaml
