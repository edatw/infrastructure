---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# edatw-lab overlay for OpenShell.
# Wraps the shared base (namespace, in-cluster PKI, HelmRepository, HelmRelease)
# and adds the env-specific SOPS-encrypted SSH handshake secret the gateway
# requires (normally created by the CLI bootstrap, which a Flux install skips).
resources:
  - ../../../base/openshell
  # SOPS-encrypted NSSH1 HMAC handshake key (decrypted by kustomize-controller).
  # Generate/rotate with `just secret-ssh-handshake`.
  - secret-ssh-handshake.enc.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: edatw-lab
      app.kubernetes.io/environment: production
