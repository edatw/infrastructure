---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ArgoCD projects overlay for edatw-lab: the AppProject + Applications only.
# The ArgoCD install (HelmRelease, namespace, KSOPS sops-age secret) lives in
# the sibling argocd/edatw-lab overlay; this overlay depends on it at runtime.
resources:
  # ArgoCD Projects (AppProject + Applications)
  - ../../../base/argocd-projects/edatw

labels:
  - pairs:
      app.kubernetes.io/instance: edatw-lab
      app.kubernetes.io/environment: production

# Patch edatw application paths (from github.com/edatw/infrastructure)
patches:
  - patch: |-
      - op: replace
        path: /spec/source/path
        value: argocd/edatw-cloudflared/overlays/edatw-lab
      - op: replace
        path: /spec/source/targetRevision
        value: main
    target:
      kind: Application
      name: edatw-cloudflared
  - patch: |-
      - op: replace
        path: /spec/source/path
        value: argocd/edatw-ed8/overlays/edatw-lab
      - op: replace
        path: /spec/source/targetRevision
        value: main
    target:
      kind: Application
      name: edatw-ed8
  - patch: |-
      - op: replace
        path: /spec/source/path
        value: argocd/edatw-openclaw/overlays/edatw-lab
      - op: replace
        path: /spec/source/targetRevision
        value: main
    target:
      kind: Application
      name: edatw-openclaw
  - patch: |-
      - op: replace
        path: /spec/source/path
        value: argocd/edatw-salary-mailman/overlays/edatw-lab
      - op: replace
        path: /spec/source/targetRevision
        value: main
    target:
      kind: Application
      name: edatw-salary-mailman
