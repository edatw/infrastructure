---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: edatw-openclaw

resources:
  - namespace.yaml
  # Pre-created data PVC with OpenEBS FilePermissions (dir owned by uid/gid 1000);
  # the OpenClawInstance binds it via storage.persistence.existingClaim.
  - pvc-data.yaml
  # Operator-managed agent: the OpenClawInstance generates the StatefulSet,
  # Service and NetworkPolicy (data PVC is the pre-created one above). The client
  # mTLS cert chains to the shared openshell-ca for the OpenShell sandbox backend.
  - certificate-openshell-client.yaml
  - openclawinstance.yaml

labels:
  - pairs:
      app.kubernetes.io/name: openclaw
      app.kubernetes.io/component: gateway
