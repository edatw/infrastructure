---
# Client mTLS cert for OpenClaw -> OpenShell gateway.
# Chains to the shared openshell-ca ClusterIssuer (flux/base/openshell), which is
# the CA the gateway verifies clients against (server.tls.clientCaSecretName).
# The resulting Secret carries tls.crt / tls.key / ca.crt; the OpenClawInstance
# mounts it where the openshell CLI looks for a direct-endpoint gateway bundle.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openclaw-openshell-client
  namespace: edatw-openclaw
spec:
  secretName: openclaw-openshell-mtls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  commonName: openclaw-agent
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - client auth
  issuerRef:
    name: openshell-ca
    kind: ClusterIssuer
    group: cert-manager.io
