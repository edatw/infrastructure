---
# Namespace for the OpenClaw self-hosted AI assistant gateway
apiVersion: v1
kind: Namespace
metadata:
  name: edatw-openclaw
  labels:
    app: openclaw
    component: gateway
    # OpenClaw runs non-root (uid 1000), drops all capabilities and uses the
    # RuntimeDefault seccomp profile, so the restricted Pod Security Standard
    # is satisfied.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
