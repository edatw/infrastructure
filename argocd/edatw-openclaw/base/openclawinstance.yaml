---
# OpenClaw agent, operator-managed (openclaw-operator, flux/base/openclaw-operator).
# Replaces the former hand-rolled Deployment/Service/PVCs/SA — the operator
# generates a StatefulSet + Service + data PVC + NetworkPolicy from this spec.
#
# Tool execution is sandboxed through the in-cluster OpenShell gateway over mTLS.
apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: openclaw
  namespace: edatw-openclaw
spec:
  image:
    # Custom image = stock OpenClaw + the openshell CLI (argocd/edatw-openclaw/image),
    # built/pushed by .github/workflows/openclaw-image.yml.
    repository: ghcr.io/edatw/openclaw-openshell
    tag: "2026.6.11-os0.0.71"
    pullPolicy: IfNotPresent
    # GHCR package is private; pull with ghcr-pull-secret (GitHub PAT with
    # read:packages), delivered as a SOPS dockerconfigjson via the edatw-lab
    # overlay (KSOPS).
    pullSecrets:
      - name: ghcr-pull-secret

  storage:
    # Single data PVC; the operator mounts it at ~/.openclaw, ~/.local, ~/.cache,
    # ~/.config (HOME=/home/openclaw). ~/.config is where the openshell CLI keeps
    # its gateway state, so the mTLS mount below lands on a writable PVC path.
    # Bind a pre-created PVC (pvc-data.yaml) carrying OpenEBS FilePermissions so
    # the dir is owned by uid/gid 1000 (the operator's persistence block has no
    # annotations field, so existingClaim is the way to set provisioning perms).
    persistence:
      enabled: true
      existingClaim: openclaw-data-fsfix

  # Install the OpenShell sandbox plugin (npm, via init container). The openshell
  # CLI it shells out to is baked into the custom image (on PATH). The copilot
  # plugin provides the github-copilot fallback provider (external Copilot CLI
  # runtime); it needs a Copilot OAuth token (see envFrom below).
  plugins:
    - "@openclaw/openshell-sandbox"
    - "@openclaw/copilot"

  env:
    # The openshell CLI connects directly to this endpoint and derives its mTLS
    # bundle dir from the (sanitized) URL — must match the mount path below.
    - name: OPENSHELL_GATEWAY_ENDPOINT
      value: "https://openshell.openshell.svc.cluster.local:8080"

  # LLM provider credentials (COPILOT_GITHUB_TOKEN for the github-copilot
  # fallback). Secret delivered SOPS-encrypted via the edatw-lab overlay (KSOPS).
  envFrom:
    - secretRef:
        name: openclaw-api-keys

  # Mount the client mTLS bundle where the openshell CLI looks for a direct
  # https endpoint: ~/.config/openshell/gateways/<sanitized-endpoint>/mtls/
  # (the URL with '://' and ':' replaced by '_'). Holds ca.crt/tls.crt/tls.key.
  extraVolumes:
    - name: openshell-mtls
      secret:
        secretName: openclaw-openshell-mtls
  extraVolumeMounts:
    - name: openshell-mtls
      mountPath: /home/openclaw/.config/openshell/gateways/https___openshell.openshell.svc.cluster.local_8080/mtls
      readOnly: true

  security:
    # Trust the gateway CA from the OpenClaw (node) process too (mounted at
    # /etc/ssl/certs/custom-ca-bundle.crt + NODE_EXTRA_CA_CERTS).
    caBundle:
      secretName: openclaw-openshell-mtls
      key: ca.crt
    # Default egress is DNS + HTTPS; open the gateway's port explicitly. SSH to
    # sandboxes is tunneled THROUGH the gateway, so this one rule suffices.
    networkPolicy:
      enabled: true
      # Default ingress is same-namespace only; allow the cloudflared connector
      # (ns: edatw) to reach the gateway so the tunnel can serve openclaw.eda-tw.com.
      allowedIngressNamespaces:
        - edatw
      additionalEgress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: openshell
          ports:
            - protocol: TCP
              port: 8080
        # Tailnet host (shangkuei-windows-asrock) reached via the `ollama`
        # ExternalName Service (overlay), which resolves to the Tailscale egress
        # proxy in the `tailscale` namespace (full-host DNAT, all ports).
        #  - 11434: Ollama LLM server.
        #  - 8080:  AutoCAD MCP server (SSE), on the same host (see mcpServers
        #           below). The host must listen on 0.0.0.0:8080.
        # (Copilot fallback is plain HTTPS, already covered by default egress.)
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: tailscale
          ports:
            - protocol: TCP
              port: 11434
            - protocol: TCP
              port: 8080

  # Control UI is reached via the cloudflared tunnel (no Ingress for the operator
  # to derive the origin from), so allow it explicitly. First-class gateway field;
  # the operator also auto-injects the localhost origins.
  gateway:
    controlUiOrigins:
      - https://openclaw.eda-tw.com

  # OpenClaw app config (openclaw.json). Route tool execution into OpenShell,
  # and set the LLM providers: Ollama (on the tailnet) as the default primary,
  # GitHub Copilot as the fallback.
  config:
    mergeMode: merge
    raw:
      # SECURITY — override the operator's controlUi.dangerouslyDisableDeviceAuth
      # to FALSE, re-enabling OpenClaw per-device identity/pairing (verified to work
      # in this environment). config.raw merges OVER the operator defaults, so this
      # wins. The operator still manages the rest: gateway.auth (Secret
      # openclaw-gateway-token, mode: token, OPENCLAW_GATEWAY_TOKEN) and
      # gateway.mode: local — left as-is.
      #  - Log in to the Control UI with the token in the URL FRAGMENT (NOT
      #    ?query): https://openclaw.eda-tw.com/#token=<token>
      #      token: kubectl -n edatw-openclaw get secret openclaw-gateway-token \
      #        -o jsonpath='{.data.token}' | base64 -d
      #    controlUiOrigins (spec.gateway below) already allows this host.
      #  - Nodes are gated by device pairing approval. Public exposure is behind the
      #    cloudflared tunnel + edge rate-limit. Tool exec stays sandboxed
      #    (agents.defaults.sandbox below).
      gateway:
        controlUi:
          dangerouslyDisableDeviceAuth: false
      # LLM provider registry. Ollama is reached via the Tailscale egress Service
      # (overlay). Explicit baseUrl disables auto-discovery, so models must be
      # declared. No `/v1` suffix — that would select OpenAI-compat mode where
      # tool calling is unreliable; `api: ollama` keeps native tool-calling.
      models:
        providers:
          ollama:
            baseUrl: "http://ollama.edatw-openclaw.svc.cluster.local:11434"
            api: "ollama"
            apiKey: "ollama-local" # placeholder; the LAN host needs no real key
            models:
              - id: "gemma4"
                name: "gemma4"
      plugins:
        # Allowlist gates which plugins may load; include copilot alongside the
        # existing ones so the github-copilot fallback runtime is permitted.
        allow:
          - openshell
          - workboard
          - copilot
        # Required since the OpenClaw config schema made plugins.allow also gate
        # bundled provider discovery: without this, startup validation fails with
        # "<root>: Invalid input" and the pod crash-loops at init-plugins.
        # "compat" = what `openclaw doctor --fix` sets: keep the legacy behavior
        # (bundled providers discovered regardless of allow). Tighten to
        # "allowlist" later if bundled providers should be gated by allow.
        bundledDiscovery: compat
        entries:
          openshell:
            enabled: true
            config:
              mode: mirror # keep the operator PVC canonical
              gatewayEndpoint: "https://openshell.openshell.svc.cluster.local:8080"
              timeoutSeconds: 180
          # Workboard plugin (visual task board in the Control UI).
          workboard:
            enabled: true
      agents:
        defaults:
          # Default model = local Ollama; fall back to GitHub Copilot when the
          # tailnet host / Ollama is unreachable.
          model:
            primary: "ollama/gemma4"
            fallbacks:
              - "github-copilot/auto"
          # Route the copilot model ref through the external Copilot CLI runtime
          # (provided by the @openclaw/copilot plugin). Auth = COPILOT_GITHUB_TOKEN
          # from the openclaw-api-keys Secret (envFrom above).
          models:
            "github-copilot/auto":
              agentRuntime:
                id: copilot
          sandbox:
            mode: all
            backend: openshell
