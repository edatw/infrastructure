# LLM provider credentials for OpenClaw, consumed via `envFrom` on the
# OpenClawInstance (argocd/edatw-openclaw/base/openclawinstance.yaml).
#
# COPILOT_GITHUB_TOKEN: a GitHub Copilot OAuth access token from a ONE-TIME
# device-login on a workstation with an active Copilot subscription:
#     openclaw models auth login-github-copilot
# (or lift `oauth_token` from ~/.config/github-copilot/hosts.json). A plain
# classic/fine-grained PAT is NOT accepted by the github-copilot provider.
# OpenClaw exchanges this long-lived OAuth token for short-lived Copilot API
# tokens at runtime.
#
# Decrypted by KSOPS in the ArgoCD repo-server at render time.
# BEFORE COMMIT: replace the placeholder, then `just encrypt-all` in this dir.
