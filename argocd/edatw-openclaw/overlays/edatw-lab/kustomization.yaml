---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: edatw-openclaw

resources:
  - ../../base
  # ingress-tailscale.yaml is intentionally NOT included yet — enable it after
  # the gateway/UI is verified (https://openclaw.<tailnet>.ts.net).

# KSOPS generator for the GHCR image pull secret (ghcr-pull-secret).
generators:
  - ksops-generator.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: edatw-lab
      app.kubernetes.io/environment: production
