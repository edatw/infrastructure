---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: edatw-openclaw

resources:
  - ../../base
  # Tailscale egress to the Ollama server on the tailnet (OpenClaw's default LLM
  # provider). Requires the Tailscale operator (flux/base/tailscale-operator).
  - service-ollama-egress.yaml
  # ingress-tailscale.yaml is intentionally NOT included yet — enable it after
  # the gateway/UI is verified (https://openclaw.<tailnet>.ts.net).

# KSOPS generator for the GHCR image pull secret (ghcr-pull-secret).
generators:
  - ksops-generator.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: edatw-lab
      app.kubernetes.io/environment: production
