---
# Tailscale Ingress for OpenClaw.
# Exposes the gateway / Control UI to the tailnet as:
#   https://openclaw.<tailnet>.ts.net
# Requires the Tailscale operator (see flux/.../tailscale-operator) to be
# running with a valid operator-oauth secret.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openclaw
  namespace: edatw-openclaw
  annotations:
    tailscale.com/proxy-class: "default"
    # Funnel (public internet) -- enable later. Requires the tailnet ACL to grant
    # the `funnel` nodeAttr to tag:k8s-service. Funnel serves 443/8443/10000 only.
    # tailscale.com/funnel: "true"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: openclaw
      port:
        number: 18789
  tls:
    - hosts:
        - openclaw
