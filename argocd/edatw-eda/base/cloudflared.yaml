---
# Dedicated cloudflared connector for the `eda-edatw` tunnel (edatw-lab only).
# Split from the shared `talos-edatw` tunnel because that tunnel's connector also
# runs in other clusters without the eda variant — a shared tunnel would let
# eda.eda-tw.com requests land on a connector with no eda backend (502). This
# tunnel's connector runs only where the eda app is deployed (edatw-lab).
#
# Runs in the edatw-eda namespace. Token comes from the SOPS-encrypted
# `cloudflared-eda-credentials` secret (overlay), sourced from terraform output
# `eda_tunnel_token`.
#
# Selector uses the plain `app` label: the base/overlay kustomize `labels`
# transformers set app.kubernetes.io/component (to `eda`), so the selector must
# key off a label they don't rewrite.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared-eda
  namespace: edatw-eda
  labels:
    app: cloudflared-eda
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-eda
  namespace: edatw-eda
  labels:
    app: cloudflared-eda
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared-eda
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: cloudflared-eda
    spec:
      serviceAccountName: cloudflared-eda
      dnsPolicy: ClusterFirst
      # HA: never co-schedule the two connector replicas on the same node.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: cloudflared-eda
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --protocol
            - http2
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-eda-credentials
                  key: tunnel-token
          resources:
            limits:
              memory: 128Mi
              cpu: 100m
            requests:
              memory: 64Mi
              cpu: 50m
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          livenessProbe:
            httpGet:
              path: /metrics
              port: 20241
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: 20241
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
